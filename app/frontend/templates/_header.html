        {# Shared page header. The app name links back to the dashboard from any page. #}
        {# Set `current_page` before including it; the Refresh button only shows on the dashboard. #}
        <div class="dashboard-header">
            <h1>
                <a href="{{ url_for('get_dashboard') }}" class="home-link" title="Go to the dashboard">Inwebstigator</a>
            </h1>

            <div class="header-actions">

            {% if current_page == "dashboard" %}
            <button
                type="button"
                class="reload-button"
                id="reloadPageBtn"
                title="Reload the dashboard to show the latest scan results"
            >
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <path d="M13.5 8a5.5 5.5 0 11-1.61-3.89" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M13.5 2.5v3h-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>

                <span class="reload-button-label">Refresh</span>
            </button>
            {% endif %}

            <button
                type="button"
                class="theme-toggle"
                id="themeToggleBtn"
                aria-label="Toggle light or dark mode"
            >
                <!-- Sun icon, shown in dark mode -->
                <svg id="themeIconDark" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <circle cx="8" cy="8" r="3.5" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3.1 3.1l1 1M11.9 11.9l1 1M3.1 12.9l1-1M11.9 4.1l1-1"
                          stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                </svg>

                <!-- Moon icon, shown in light mode -->
                <svg id="themeIconLight" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <path d="M13.5 9.5A5.5 5.5 0 016.5 2.5a5.5 5.5 0 100 11 5.5 5.5 0 007-4z"
                          stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>

                <span id="themeToggleLabel"></span>
            </button>

            </div>

        </div>
