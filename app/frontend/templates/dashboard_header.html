{# The app's name, the light / dark mode button and the Websites / Updates tabs. #}

<div class="dashboard-header">
    <div class="dashboard-brand">
        <img
            src="{{ url_for('static', path='logo.png') }}"
            alt=""
            class="brand-logo brand-logo-light"
            width="72"
            height="72"
        >
        <img
            src="{{ url_for('static', path='logo-dark.png') }}"
            alt=""
            class="brand-logo brand-logo-dark"
            width="72"
            height="72"
        >
        <h1>Inwebstigator</h1>
    </div>

    <button
        type="button"
        class="theme-toggle"
        id="themeToggleBtn"
        aria-label="Toggle light or dark mode"
    >
        <!-- Sun icon, shown in dark mode -->
        <svg id="themeIconDark" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="8" cy="8" r="3.5" stroke="currentColor" stroke-width="1.5"/>
            <path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3.1 3.1l1 1M11.9 11.9l1 1M3.1 12.9l1-1M11.9 4.1l1-1"
                  stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>

        <!-- Moon icon, shown in light mode -->
        <svg id="themeIconLight" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M13.5 9.5A5.5 5.5 0 016.5 2.5a5.5 5.5 0 100 11 5.5 5.5 0 007-4z"
                  stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>

        <span id="themeToggleLabel"></span>
    </button>

</div>

<div class="tab-buttons" role="tablist" aria-label="Dashboard sections">
    <button
        type="button"
        id="websites-tab"
        class="tab-button active"
        role="tab"
        aria-selected="true"
        aria-controls="websites-panel"
    >WEBSITES</button>
    <button
        type="button"
        id="updates-tab"
        class="tab-button"
        role="tab"
        aria-selected="false"
        aria-controls="updates-panel"
        tabindex="-1"
    >UPDATES</button>
</div>
