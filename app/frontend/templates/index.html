<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Setup - Website Monitoring</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>

    <!-- Top Navigation -->
    <nav class="top-nav">
        <a href="/" class="current-nav">Scanner Setup</a>
        <a href="/dashboard">Dashboard</a>
    </nav>

    <main class="container">
        <h1 class="header-title">Run Website Scanner</h1>
        <p class="header-meta">Manually trigger website tracking and diff generation</p>

        <hr>

        <section class="scanner-section">
            <h2 class="section-title" style="border:none; margin-bottom: 0;">Single Website Scan</h2>
            
            <form id="scanner-form">
                <div class="form-group">
                    <label for="url">Website URL:</label>
                    <input type="text" id="url" name="url" placeholder="https://example.com" required>
                </div>

                <div class="form-group">
                    <label for="recipient_email">Recipient Email:</label>
                    <input type="email" id="recipient_email" name="recipient_email" placeholder="user@example.com" required>
                </div>

                <div class="form-group">
                    <label for="max_pages">Max Pages (Optional):</label>
                    <input type="number" id="max_pages" name="max_pages" placeholder="50">
                </div>

                <div class="form-group">
                    <label for="delay">Delay in seconds (Optional):</label>
                    <input type="text" id="delay" name="delay" placeholder="1.0">
                </div>

                <div class="form-group">
                    <label for="concurrent">Concurrent Requests (Optional):</label>
                    <input type="number" id="concurrent" name="concurrent" placeholder="5">
                </div>

                <button type="submit" id="submit-btn">Run Scan</button>
            </form>

            <hr class="section-divider">

            <h2 class="section-title" style="border:none; margin-bottom: 0;">Run All Websites Scan</h2>
            
            <form id="scanner-all-form">
                <div class="form-group">
                    <label for="all_recipient_email">Recipient Email (for Run All):</label>
                    <input type="email" id="all_recipient_email" name="recipient_email" placeholder="user@example.com" required>
                </div>
                <button type="submit" id="submit-all-btn">Run All Eligible Scans</button>
            </form>
        </section>

        <!-- Container where HTML results from backend will be injected -->
        <div id="result-container" class="result-container hidden"></div>
    </main>

    <!-- JavaScript to handle submissions asynchronously via Fetch API -->
    <script>
        // Handle Single Website Scan
        document.getElementById('scanner-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const container = document.getElementById('result-container');
            const submitBtn = document.getElementById('submit-btn');

            container.classList.remove('hidden');
            container.innerHTML = '<p class="status-msg status-primary loading">Scanning website, please wait (this may take a minute)...</p>';
            submitBtn.disabled = true;

            try {
                const response = await fetch('/scanner/run', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.detail || 'Failed to run scan');
                }

                const htmlResult = await response.text();
                container.innerHTML = htmlResult;
            } catch (err) {
                container.innerHTML = `<p class="status-msg status-error">Error: ${err.message}</p>`;
            } finally {
                submitBtn.disabled = false;
            }
        });

        // Handle Run All Scans
        document.getElementById('scanner-all-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const container = document.getElementById('result-container');
            const submitAllBtn = document.getElementById('submit-all-btn');

            container.classList.remove('hidden');
            container.innerHTML = '<p class="status-msg status-secondary loading">Running all scans, please wait...</p>';
            submitAllBtn.disabled = true;

            try {
                const response = await fetch('/scanner/run_all', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error('Failed to run batch scans');
                }

                const htmlResult = await response.text();
                container.innerHTML = htmlResult;
            } catch (err) {
                container.innerHTML = `<p class="status-msg status-error">Error: ${err.message}</p>`;
            } finally {
                submitAllBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
