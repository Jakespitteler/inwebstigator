<!DOCTYPE html>
<html lang="en" class="preloading">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inwebstigator</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', path='favicon.ico') }}?v=final-logo">

    <!-- Every request the dashboard makes carries this token, which pages from other websites cannot read -->
    <meta name="api-token" content="{{ api_token }}">
    <script>
        (function () {
            var apiToken = document.querySelector('meta[name="api-token"]').content;
            var sendRequest = window.fetch.bind(window);

            window.fetch = function (resource, options) {
                var requestOptions = Object.assign({}, options);
                // Keep a Request's own headers (e.g. its form's Content-Type) unless new ones are given
                var headers = new Headers(
                    requestOptions.headers || (resource instanceof Request ? resource.headers : {})
                );

                headers.set("{{ api_token_header }}", apiToken);
                requestOptions.headers = headers;
                return sendRequest(resource, requestOptions);
            };
        })();
    </script>

    <!-- Apply the saved theme before the first paint so the page never flashes the wrong one -->
    <script>
        (function () {
            var saved = null;

            try {
                saved = localStorage.getItem("inwebstigator-theme");
            } catch (error) {
                // Storage can be unavailable (e.g. private mode); fall back to the OS setting
            }

            var prefersDark =
                window.matchMedia("(prefers-color-scheme: dark)").matches;

            document.documentElement.setAttribute(
                "data-theme",
                saved || (prefersDark ? "dark" : "light")
            );
        })();
    </script>

    <!-- Fonts load without blocking the page; system fonts are used if offline -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Outfit:wght@700;800&display=swap"
        media="print"
        onload="this.media='all'"
    >

    <!-- The dashboard's styles, split by part of the page. responsive.css is last, as it overrides the others -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/dashboard-header.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/glass-cards.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/change-records.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/website-cards.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/collapsible-cards.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/forms.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/buttons.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/website-card-details.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/add-website-wizard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/scan-status.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/confirm-dialog.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/responsive.css') }}">
</head>

<body>

    <datalist id="saved-recipient-emails">
        {% for email in saved_recipient_emails %}
        <option value="{{ email }}"></option>
        {% endfor %}
    </datalist>

    <main class="dashboard-container">

        {% include "dashboard_header.html" %}

        {% include "updates/updates_panel.html" %}

        {% include "websites/websites_panel.html" %}

    </main>

    {% include "confirm_dialog.html" %}

    <!-- The dashboard's scripts, split by feature. They share one scope, so the order matters: each script only
         uses what the scripts before it define -->
    <script src="{{ url_for('static', path='js/helpers.js') }}"></script>
    <script src="{{ url_for('static', path='js/theme-toggle.js') }}"></script>
    <script src="{{ url_for('static', path='js/dashboard-tabs.js') }}"></script>
    <script src="{{ url_for('static', path='js/add-website-wizard.js') }}"></script>
    <script src="{{ url_for('static', path='js/collapsible-cards.js') }}"></script>
    <script src="{{ url_for('static', path='js/confirm-dialog.js') }}"></script>
    <script src="{{ url_for('static', path='js/add-website.js') }}"></script>
    <script src="{{ url_for('static', path='js/critical-pages.js') }}"></script>
    <script src="{{ url_for('static', path='js/notification-emails.js') }}"></script>
    <script src="{{ url_for('static', path='js/website-settings.js') }}"></script>
    <script src="{{ url_for('static', path='js/scans.js') }}"></script>
    <script src="{{ url_for('static', path='js/email-suggestions.js') }}?v=1"></script>

</body>

</html>
