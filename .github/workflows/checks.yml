# Runs the same checks a contributor runs locally on every push and pull request:
# linting, formatting, strict type checking and the unit tests.
# The browser tests (tests/e2e) are left out, as they need a browser installed.
name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uvx pyright

      - name: Unit tests
        run: uv run pytest -m "not e2e" -o log_cli=false
